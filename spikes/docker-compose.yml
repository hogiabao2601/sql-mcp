# Phase 3 spike engines. TEST-ONLY credentials. Separate project name, so the main
# sql-mcp-mysql stack and your other containers are never touched.
#   docker compose -f spikes/docker-compose.yml up -d --wait
#   docker compose -f spikes/docker-compose.yml down -v      # delete containers + volumes
name: sql-mcp-spike

services:
  mariadb:
    image: mariadb:11.4                # 11.4 = current long-term-support series (amd64 + arm64)
    container_name: sql-mcp-spike-mariadb
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: rootpw-test-only
      MARIADB_DATABASE: shop
    ports: ["127.0.0.1:33326:3306"]
    volumes:
      - ../mysql-init:/docker-entrypoint-initdb.d:ro     # the SAME seed as MySQL, unchanged
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  postgres:
    image: postgres:17
    container_name: sql-mcp-spike-postgres
    restart: "no"
    environment:
      POSTGRES_PASSWORD: rootpw-test-only
      POSTGRES_DB: app
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # StarRocks all-in-one (FE + BE in one container). MySQL protocol on 127.0.0.1:39030, user root, no password.
  # mem_limit protects the other containers sharing Docker Desktop's VM.
  starrocks:
    image: starrocks/allin1-ubuntu:4.1.1
    container_name: sql-mcp-spike-starrocks
    restart: "no"
    mem_limit: 3500m
    ports: ["127.0.0.1:39030:9030", "127.0.0.1:38030:8030"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -N -e 'SHOW BACKENDS' | grep -q true"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Adds network latency in front of the main sql-mcp-mysql (host port 33316), to measure
  # what a reconnect costs against a "remote" database. Listens on 127.0.0.1:33336.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: sql-mcp-spike-toxiproxy
    restart: "no"
    ports: ["127.0.0.1:58474:8474", "127.0.0.1:33336:33336"]
